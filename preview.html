<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Demo Website Preview — Built by DevEloped Web Co.</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0B0F17;
      color: #F8FAFC;
      line-height: 1.5;
      padding-top: 56px;
    }

    /* PART 3: Fixed Un-dismissible Top Demo Lock Banner */
    .demo-top-lock-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999999;
      background: linear-gradient(90deg, #1E3A8A 0%, #2563EB 50%, #1D4ED8 100%);
      border-bottom: 2px solid #93C5FD;
      color: #FFFFFF;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65);
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .demo-top-lock-banner a {
      color: #FEF08A;
      text-decoration: underline;
      font-weight: 800;
      white-space: nowrap;
    }

    /* PART 3: Faint Diagonal DEMO Watermark Overlay */
    .demo-watermark-layer {
      position: fixed;
      inset: 0;
      z-index: 99990;
      pointer-events: none;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      grid-auto-rows: 180px;
      opacity: 0.045;
      user-select: none;
    }
    .demo-watermark-text {
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-28deg);
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #FFFFFF;
      white-space: nowrap;
    }

    /* Site Navigation */
    .site-nav {
      position: sticky;
      top: 52px;
      z-index: 100;
      background: rgba(11, 15, 23, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .nav-brand {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); opacity: 0.95; }
    .btn-accent {
      background: var(--accent, #F59E0B);
      color: var(--accent-fg, #090C10);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .btn-outline {
      background: rgba(255,255,255,0.06);
      color: #F8FAFC;
      border: 1px solid rgba(255,255,255,0.18);
    }

    /* Hero Section with On-Theme Photo Backdrop */
    .hero {
      position: relative;
      padding: 64px 20px 56px;
      text-align: center;
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .hero-inner {
      max-width: 820px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }
    .cat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-light, #FDE68A);
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: clamp(30px, 6vw, 52px);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.08;
      margin-bottom: 14px;
      color: #FFFFFF;
      text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .hero p {
      font-size: clamp(15px, 2.5vw, 18px);
      color: #E2E8F0;
      max-width: 640px;
      margin: 0 auto 22px;
    }
    .social-proof-bar {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(251, 191, 36, 0.45);
      padding: 9px 18px;
      border-radius: 12px;
      margin-bottom: 26px;
      font-size: 14px;
      font-weight: 700;
      color: #F8FAFC;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .stars { color: #FBBF24; letter-spacing: 1px; }
    .hero-ctas {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Trust Badges Strip */
    .trust-strip {
      max-width: 1040px;
      margin: -22px auto 28px;
      padding: 0 16px;
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .trust-badge-card {
      background: #131B2E;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #F1F5F9;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }

    /* Content Sections */
    .section {
      max-width: 1040px;
      margin: 0 auto;
      padding: 36px 20px;
    }
    .section-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .section-header h2 {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 800;
      margin-bottom: 6px;
    }
    .section-header p {
      color: #94A3B8;
      font-size: 14.5px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 18px;
    }
    .item-card {
      background: #131B2E;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .item-title { font-size: 17px; font-weight: 800; color: #FFFFFF; }
    .item-price {
      font-family: monospace;
      font-size: 15px;
      font-weight: 800;
      color: var(--accent-light, #FDE68A);
      background: rgba(255,255,255,0.06);
      padding: 3px 9px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .item-desc { font-size: 13.5px; color: #94A3B8; }

    /* Photo Gallery Grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .photo-card {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      background: #131B2E;
      aspect-ratio: 16 / 10;
      position: relative;
    }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 14px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      font-size: 12.5px;
      font-weight: 700;
      color: #F8FAFC;
    }

    /* Location & Hours + Interactive Form Card */
    .split-box {
      background: #131B2E;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 26px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 24px;
    }
    .demo-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.14);
      background: #0B0F17;
      color: #FFFFFF;
      font-size: 14px;
      margin-bottom: 10px;
    }

    /* Locked Feature Modal Popup */
    .demo-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000000;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .demo-modal-backdrop.open { display: flex; }
    .demo-modal {
      background: #131B2E;
      border: 2px solid #3B82F6;
      border-radius: 16px;
      max-width: 460px;
      width: 100%;
      padding: 26px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    @media (max-width: 768px) {
      body { padding-top: 74px; }
      .site-nav { top: 70px; padding: 12px 14px; }
      .hero { padding: 42px 14px 40px; }
      .section { padding: 26px 14px; }
      .split-box { padding: 18px; }
    }
  </style>
</head>
<body>
  <!-- PART 3: Fixed Top Demo Lock Banner (Cannot be closed or dismissed) -->
  <div class="demo-top-lock-banner" id="demo-lock-banner">
    <span id="demo-banner-text">
      DEMO PREVIEW — This sample site was built for [Business Name] by DevEloped Web Co. Like it? Call <a href="tel:5057175683">(505) 717-5683</a> to make it yours.
    </span>
  </div>

  <!-- PART 3: Faint Diagonal DEMO Watermark Background -->
  <div class="demo-watermark-layer" id="watermark-layer" aria-hidden="true"></div>

  <!-- Main Auto-Generated Demo Website Container -->
  <div id="demo-site-root"></div>

  <!-- PART 3: Locked Feature Popup Modal -->
  <div class="demo-modal-backdrop" id="demo-lock-modal">
    <div class="demo-modal">
      <div style="font-size:36px;margin-bottom:10px;">🔒</div>
      <h3 style="font-size:19px;font-weight:800;color:#FFFFFF;margin-bottom:10px;">Demo Preview Feature</h3>
      <p style="font-size:15px;color:#E2E8F0;line-height:1.55;margin-bottom:20px;" id="demo-lock-modal-msg">
        This feature goes live when the site is yours — call DevEloped Web Co. at (505) 717-5683.
      </p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <a href="tel:5057175683" class="btn btn-accent" style="background:#3B82F6;color:#FFFFFF;">📞 Call (505) 717-5683</a>
        <button type="button" class="btn btn-outline" id="demo-lock-modal-close">Close Preview Note</button>
      </div>

  <script type="module">
    import { INITIAL_LEADS, slugifyLeadName } from '/js/seed-data.js';

    // Populate diagonal DEMO watermark grid
    const wmLayer = document.getElementById('watermark-layer');
    if (wmLayer) {
      wmLayer.innerHTML = Array.from({ length: 36 })
        .map(() => '<div class="demo-watermark-text">DEMO</div>')
        .join('');
    }

    // Resolve lead from URL path (/demo/business-name-slug) or query params
    function resolveLeadData() {
      const params = new URLSearchParams(window.location.search);
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      let targetSlug = params.get('slug') || '';
      if (!targetSlug && pathParts[0] === 'demo' && pathParts[1]) {
        targetSlug = decodeURIComponent(pathParts[1]).toLowerCase();
      }

      // Check localStorage first (includes user edits or custom added leads)
      let allLeads = [...INITIAL_LEADS];
      try {
        const saved = JSON.parse(localStorage.getItem('developed_leaddesk_crm_live_v2') || '{}');
        if (Array.isArray(saved.leads) && saved.leads.length > 0) {
          const map = new Map();
          for (const l of INITIAL_LEADS) map.set(slugifyLeadName(l.businessName), l);
          for (const l of saved.leads) map.set(slugifyLeadName(l.businessName), l);
          allLeads = Array.from(map.values());
        }
      } catch (e) {}

      if (targetSlug) {
        const cleanTarget = slugifyLeadName(targetSlug);
        const match = allLeads.find(l => {
          const s1 = slugifyLeadName(l.businessName);
          const s2 = String(l.businessName || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
          return s1 === cleanTarget || s2 === cleanTarget || s1 === targetSlug || s2 === targetSlug;
        });
        if (match) return match;

        // Graceful fallback if someone visits /demo/any-custom-slug not in seed list
        const fallbackName = targetSlug
          .split('-')
          .map(w => w.charAt(0).toUpperCase() + w.slice(1))
          .join(' ');
        return {
          businessName: params.get('biz') || fallbackName,
          category: params.get('cat') || 'Local Business',
          phone: params.get('phone') || '(505) 555-0199',
          address: params.get('addr') || 'Central Ave',
          city: params.get('city') || 'Albuquerque, NM',
          rating: Number(params.get('rating')) || 4.8,
          reviewCount: Number(params.get('reviews')) || 48
        };
      }

      // Query string fallback (/preview.html?biz=...)
      if (params.get('biz')) {
        const matchByName = allLeads.find(
          l => slugifyLeadName(l.businessName) === slugifyLeadName(params.get('biz'))
        );
        if (matchByName) return matchByName;
        return {
          businessName: params.get('biz'),
          category: params.get('cat') || 'Local Business',
          phone: params.get('phone') || '(505) 555-0199',
          address: params.get('addr') || 'Central Ave',
          city: params.get('city') || 'Albuquerque, NM',
          rating: Number(params.get('rating')) || 4.8,
          reviewCount: Number(params.get('reviews')) || 48
        };
      }

      return allLeads[0];
    }

    function getTemplateConfig(lead) {
      const cat = String(lead.category || '').toLowerCase();
      const cityShort = String(lead.city || 'Albuquerque, NM').split(',')[0].trim();

      // 1. Restaurants / Food Trucks / Bakeries: menu-style sections, big appetizing colors, call-to-order button
      if (cat.includes('mexican') || cat.includes('restaurant') || cat.includes('taco') || cat.includes('truck') || cat.includes('diner') || cat.includes('baker') || cat.includes('panaderia') || cat.includes('sweet') || cat.includes('donut')) {
        const isBakery = cat.includes('baker') || cat.includes('panaderia') || cat.includes('sweet') || cat.includes('donut');
        return {
          styleType: 'food',
          accent: '#EA580C',
          accentLight: '#FDBA74',
          accentFg: '#FFFFFF',
          heroBg: isBakery
            ? 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=1400&q=80'
            : 'https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=1400&q=80',
          tagline: isBakery
            ? `Fresh-baked daily in ${cityShort}. Artisanal pastries, pan dulce, custom celebration cakes & warm family hospitality.`
            : `Authentic, made-to-order flavors in ${cityShort}. Hot off the grill with fresh local ingredients, handmade salsas & fast pickup.`,
          primaryCtaLabel: '📲 Order Online for Pickup',
          callCtaLabel: `📞 Call to Order: ${lead.phone}`,
          sectionTitle: isBakery ? 'Fresh Daily Bakery Menu' : 'Signature Menu Favorites',
          sectionSub: 'Prepared fresh every morning — call ahead or order online to skip the line',
          trustBadges: [
            '🔥 Made Fresh Daily From Scratch',
            `📍 Local ${cityShort} Favorite`,
            '🥡 Fast Call-Ahead Pickup & Catering',
            '⭐ Top-Rated Local Kitchen'
          ],
          items: isBakery
            ? [
                { name: 'Fresh Pan Dulce & Conchas Box', price: '$14.50', desc: 'Assorted traditional sweet breads, warm cinnamon churros, and fruit empanadas baked fresh at dawn.', btn: 'Add to Order' },
                { name: 'Custom Tres Leches & Celebration Cakes', price: 'From $42', desc: 'Rich, authentic tres leches and custom-decorated cakes for birthdays, quinceañeras, and family events.', btn: 'Request Cake Order' },
                { name: 'Morning Café de Olla & Pastry Combo', price: '$9.25', desc: 'Spiced Mexican coffee or hot chocolate paired with your choice of two fresh morning pastries.', btn: 'Add to Order' }
              ]
            : [
                { name: 'Street Taco Plate (4x Choice of Meat)', price: '$13.99', desc: 'Carne asada, al pastor, birria, or carnitas on warm corn tortillas with cilantro, onion, lime, rice & beans.', btn: 'Order Now' },
                { name: 'Loaded Red & Green Chile Burrito', price: '$12.50', desc: 'Stuffed with grilled meat, crispy potatoes, melted cheddar, pinto beans & authentic New Mexico chile.', btn: 'Order Now' },
                { name: 'Family Fiesta & Event Taco Pack', price: '$54.00', desc: 'Feeds 4–6 hungry guests with 2 lbs of grilled meats, 20 tortillas, chips, salsa bar & aguas frescas.', btn: 'Inquire Catering' }
              ],
          photos: isBakery
            ? [
                { url: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=700&q=80', caption: 'Fresh Morning Pastries & Pan Dulce' },
                { url: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=700&q=80', caption: 'Custom Celebration & Tres Leches Cakes' },
                { url: 'https://images.unsplash.com/photo-1517433670267-08bbd4be890f?auto=format&fit=crop&w=700&q=80', caption: 'Baked From Scratch Every Day' }
              ]
            : [
                { url: 'https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?auto=format&fit=crop&w=700&q=80', caption: 'Authentic Street Tacos Off The Grill' },
                { url: 'https://images.unsplash.com/photo-1626700051175-6818013e1d4f?auto=format&fit=crop&w=700&q=80', caption: 'Handmade Burritos & New Mexico Chile' },
                { url: 'https://images.unsplash.com/photo-1513456852971-30c0b8199d4d?auto=format&fit=crop&w=700&q=80', caption: 'Fresh Chips, Guacamole & House Salsas' }
              ]
        };
      }

      // 2. Barbers / Salons / Nails / Beauty: services + prices style sections, booking button
      if (cat.includes('barber') || cat.includes('hair') || cat.includes('nail') || cat.includes('beauty') || cat.includes('salon') || cat.includes('lash') || cat.includes('pmu')) {
        const isBarber = cat.includes('barber') || cat.includes('hair');
        return {
          styleType: 'barber_beauty',
          accent: isBarber ? '#D97706' : '#DB2777',
          accentLight: isBarber ? '#FDE68A' : '#FBCFE8',
          accentFg: '#FFFFFF',
          heroBg: isBarber
            ? 'https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=1400&q=80'
            : 'https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=1400&q=80',
          tagline: isBarber
            ? `${cityShort}'s premier grooming parlor for precision skin fades, classic scissor cuts, straight-razor shaves & beard sculpting.`
            : `Luxury nail artistry, gel extensions, spa pedicures & beauty treatments in a relaxing, spotless ${cityShort} studio.`,
          primaryCtaLabel: '📅 Book Appointment Online',
          callCtaLabel: `📞 Call Shop: ${lead.phone}`,
          sectionTitle: 'Services & Transparent Pricing',
          sectionSub: 'Reserve your chair in 30 seconds or call us for same-day walk-in availability',
          trustBadges: [
            '✂️ Master Licensed Specialists',
            '📅 Instant Online Booking 24/7',
            '✨ Hospital-Grade Sanitation',
            `📍 Proudly Serving ${cityShort}`
          ],
          items: isBarber
            ? [
                { name: 'Signature Skin Fade / Precision Taper', price: '$35', desc: 'Custom fade, razor line-up, neck shave, hot towel finish, and premium styling product.', btn: 'Book This Cut' },
                { name: 'The Executive Cut + Hot Towel Beard Trim', price: '$50', desc: 'Full tailored haircut plus beard shaping, conditioning oil, and straight-razor cheek & neck shave.', btn: 'Book Combo' },
                { name: 'Classic Kids / Senior Gentleman Cut', price: '$28', desc: 'Clean, sharp traditional haircut with detailed edging and friendly, patient service.', btn: 'Book Chair' }
              ]
            : [
                { name: 'Custom Gel-X / Acrylic Full Set + Art', price: '$65+', desc: 'Precision cuticle care, custom shaping (almond, coffin, stiletto), and hand-painted nail art.', btn: 'Book Service' },
                { name: 'Luxury Detox Spa Pedicure', price: '$55', desc: 'Warm herbal soak, sugar exfoliation scrub, hydrating mask, hot stone massage & gel polish.', btn: 'Book Service' },
                { name: 'Builder Gel Overlay / Lash & Brow Glam', price: '$60', desc: 'Long-lasting natural nail reinforcement or customized beauty enhancement tailored to your style.', btn: 'Book Service' }
              ],
          photos: isBarber
            ? [
                { url: 'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=700&q=80', caption: 'Precision Skin Fades & Line-Ups' },
                { url: 'https://images.unsplash.com/photo-1621607512214-68297480165e?auto=format&fit=crop&w=700&q=80', caption: 'Hot Towel Straight-Razor Beard Work' },
                { url: 'https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=700&q=80', caption: 'Modern Chairs & Walk-In Friendly Atmosphere' }
              ]
            : [
                { url: 'https://images.unsplash.com/photo-1632345031435-8727f6897d53?auto=format&fit=crop&w=700&q=80', caption: 'Custom Nail Art & Gel Extensions' },
                { url: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=700&q=80', caption: 'Relaxing Luxury Studio Experience' },
                { url: 'https://images.unsplash.com/photo-1519014816548-bf5fe059798b?auto=format&fit=crop&w=700&q=80', caption: 'Flawless Finishes & Top-Shelf Products' }
              ]
        };
      }
      // 3. Tattoo: gallery-style layout, booking button
      if (cat.includes('tattoo') || cat.includes('ink') || cat.includes('pierc')) {
        return {
          styleType: 'tattoo',
          accent: '#8B5CF6',
          accentLight: '#DDD6FE',
          accentFg: '#FFFFFF',
          heroBg: 'https://images.unsplash.com/photo-1598371839696-5c5bb00bdc28?auto=format&fit=crop&w=1400&q=80',
          tagline: `Custom tattoo artistry & body piercing in ${cityShort}. Black & grey realism, traditional, fine-line, and custom cover-ups in a sterile studio.`,
          primaryCtaLabel: '📅 Book Tattoo Consultation',
          callCtaLabel: `📞 Call Studio: ${lead.phone}`,
          sectionTitle: 'Featured Artist Styles & Studio Rates',
          sectionSub: 'Browse our custom portfolio gallery below and book a free design consultation',
          trustBadges: [
            '🖋 Custom Flash & Full Sleeve Design',
            '🛡 100% Hospital-Grade Sterile Studio',
            `📍 Local ${cityShort} Artists`,
            '⚡ Walk-Ins Welcome Daily'
          ],
          items: [
            { name: 'Custom Black & Grey / Realism Session', price: '$150/hr', desc: 'Detailed custom shading, portraits, sleeves, and forearm/back pieces designed around your vision.', btn: 'Book Artist' },
            { name: 'American Traditional / Neo-Traditional', price: 'From $120', desc: 'Bold lines, vibrant lasting color palettes, and timeless flash or custom pieces.', btn: 'Book Artist' },
            { name: 'Fine-Line, Script & Walk-In Flash', price: '$80 Shop Min', desc: 'Same-day walk-in availability for crisp script lettering, minimalist line art, and flash designs.', btn: 'Check Walk-In Times' }
          ],
          photos: [
            { url: 'https://images.unsplash.com/photo-1565058379802-bbe93b2f703a?auto=format&fit=crop&w=700&q=80', caption: 'Custom Black & Grey Realism Work' },
            { url: 'https://images.unsplash.com/photo-1611501275019-9b5cda994e8d?auto=format&fit=crop&w=700&q=80', caption: 'Precision Linework & Custom Sleeves' },
            { url: 'https://images.unsplash.com/photo-1590246814883-57c511a76917?auto=format&fit=crop&w=700&q=80', caption: 'Clean, Private Studio Stations' }
          ]
        };
      }

      // 4. Auto / Trades / Local Services: services list, "call for a quote" button, trust badges (licensed, local, family-owned)
      return {
        styleType: 'auto_trades',
        accent: '#2563EB',
        accentLight: '#93C5FD',
        accentFg: '#FFFFFF',
        heroBg: 'https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?auto=format&fit=crop&w=1400&q=80',
        tagline: `Dependable, honest ${lead.category || 'service'} specialists proudly serving ${cityShort} and surrounding New Mexico communities. Upfront quotes & guaranteed workmanship.`,
        primaryCtaLabel: '📋 Request a Free Estimate',
        callCtaLabel: `📞 Call for a Quote: ${lead.phone}`,
        sectionTitle: 'Our Core Services & Capabilities',
        sectionSub: 'Honest diagnostics, fair local pricing, and fast turnaround you can count on',
        trustBadges: [
          '🛡 Licensed, Insured & Certified',
          `🏠 Local & Family-Owned in ${cityShort}`,
          '💯 Upfront Pricing — No Hidden Fees',
          '⚡ Same-Day Quotes & Fast Turnaround'
        ],
        items: [
          { name: 'Complete Diagnostics, Inspection & Estimate', price: 'Free Quote', desc: `Thorough inspection by experienced ${cityShort} technicians with a clear, honest breakdown before any work begins.`, btn: 'Request Quote' },
          { name: 'Full Repair, Maintenance & Installation', price: 'Warranty Backed', desc: 'Commercial-grade parts, factory-spec repairs, and dependable service backed by our local workmanship guarantee.', btn: 'Schedule Service' },
          { name: 'Priority / Same-Day Emergency Service', price: 'Fast Dispatch', desc: 'Need urgent help today? Call our direct line for priority scheduling and rapid turnaround.', btn: 'Book Priority Slot' }
        ],
        photos: [
          { url: 'https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=700&q=80', caption: 'Professional Equipment & Diagnostics' },
          { url: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=700&q=80', caption: 'Experienced Local New Mexico Technicians' },
          { url: 'https://images.unsplash.com/photo-1530046339160-ce3e530c7d2f?auto=format&fit=crop&w=700&q=80', caption: 'Guaranteed Workmanship & Honest Pricing' }
        ]
      };
    }

    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const lead = resolveLeadData();
    const tpl = getTemplateConfig(lead);
    const bizName = lead.businessName || 'Local Business';
    const catLabel = lead.category || 'Local Business';
    const phoneDisplay = lead.phone || '(505) 555-0199';
    const phoneDigits = String(phoneDisplay).replace(/\D/g, '');
    const addressFull = `${lead.address || ''}${lead.address && lead.city ? ', ' : ''}${lead.city || 'Albuquerque, NM'}`;
    const mapsUrl = lead.googleMapsUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(bizName + ' ' + addressFull)}`;
    const ratingVal = Number(lead.rating || 4.8).toFixed(1);
    const reviewVal = lead.reviewCount || 45;

    document.title = `${bizName} — ${catLabel} | Demo Preview by DevEloped Web Co.`;
    document.documentElement.style.setProperty('--accent', tpl.accent);
    document.documentElement.style.setProperty('--accent-light', tpl.accentLight);
    document.documentElement.style.setProperty('--accent-fg', tpl.accentFg);

    // Update PART 3 top lock banner text with exact required phrasing
    const bannerEl = document.getElementById('demo-banner-text');
    if (bannerEl) {
      bannerEl.innerHTML = `DEMO PREVIEW — This sample site was built for <strong>${escapeHtml(bizName)}</strong> by DevEloped Web Co. Like it? Call <a href="tel:5057175683">(505) 717-5683</a> to make it yours.`;
    }

    const root = document.getElementById('demo-site-root');
    root.innerHTML = `
      <nav class="site-nav">
        <div class="nav-brand">${escapeHtml(bizName)}</div>
        <div class="nav-actions">
          <a href="${escapeHtml(mapsUrl)}" target="_blank" rel="noopener" class="btn btn-outline">📍 Get Directions</a>
          <a href="tel:${escapeHtml(phoneDigits)}" class="btn btn-accent">📞 ${escapeHtml(phoneDisplay)}</a>
        </div>
      </nav>

      <header class="hero" style="background-image: linear-gradient(180deg, rgba(11,15,23,0.78) 0%, rgba(11,15,23,0.92) 100%), url('${tpl.heroBg}');">
        <div class="hero-inner">
          <div class="cat-pill">✨ ${escapeHtml(catLabel)} · ${escapeHtml(lead.city || 'Albuquerque, NM')}</div>
          <h1>${escapeHtml(bizName)}</h1>
          <p>${escapeHtml(tpl.tagline)}</p>

          <div class="social-proof-bar">
            <span class="stars">★★★★★</span>
            <span>Rated ${escapeHtml(ratingVal)} stars from ${escapeHtml(String(reviewVal))} Google reviews</span>
          </div>

          <div class="hero-ctas">
            <a href="tel:${escapeHtml(phoneDigits)}" class="btn btn-accent" style="padding:14px 24px;font-size:15.5px;">
              ${escapeHtml(tpl.callCtaLabel)}
            </a>
            <button type="button" class="btn btn-outline" data-locked-feature="true" style="padding:14px 22px;font-size:15px;">
              ${escapeHtml(tpl.primaryCtaLabel)}
            </button>
            <a href="${escapeHtml(mapsUrl)}" target="_blank" rel="noopener" class="btn btn-outline" style="padding:14px 20px;font-size:15px;">
              🗺 Get Directions
            </a>
          </div>
        </div>
      </header>

      <section class="trust-strip">
        ${tpl.trustBadges.map(b => `<div class="trust-badge-card">${escapeHtml(b)}</div>`).join('')}
      </section>

      <section class="section">
        <div class="section-header">
          <h2>${escapeHtml(tpl.sectionTitle)}</h2>
          <p>${escapeHtml(tpl.sectionSub)}</p>
        </div>
        <div class="grid-3">
          ${tpl.items.map(item => `
            <div class="item-card">
              <div>
                <div class="item-top">
                  <div class="item-title">${escapeHtml(item.name)}</div>
                  <span class="item-price">${escapeHtml(item.price)}</span>
                </div>
                <p class="item-desc" style="margin-top:8px;">${escapeHtml(item.desc)}</p>
              </div>
              <button type="button" class="btn btn-outline" data-locked-feature="true" style="width:100%;">
                ${escapeHtml(item.btn)} →
              </button>
            </div>
          `).join('')}
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2>Inside ${escapeHtml(bizName)}</h2>
          <p>Quality craftsmanship and local pride in ${escapeHtml(lead.city || 'Albuquerque, NM')}</p>
        </div>
        <div class="photo-grid">
          ${tpl.photos.map(p => `
            <div class="photo-card">
              <img src="${p.url}" alt="${escapeHtml(p.caption)}" loading="lazy" />
              <div class="photo-caption">${escapeHtml(p.caption)}</div>
            </div>
          `).join('')}
        </div>
      </section>

      <section class="section">
        <div class="split-box">
          <div>
            <h3 style="font-size:22px;font-weight:800;margin-bottom:10px;">Visit or Call ${escapeHtml(bizName)}</h3>
            <p style="color:#94A3B8;font-size:14px;margin-bottom:18px;">
              Conveniently located in ${escapeHtml(lead.city || 'Albuquerque, NM')}. Tap below for turn-by-turn Google Maps directions or call us directly.
            </p>
            <div style="margin-bottom:12px;font-size:14.5px;">
              <strong>📍 Address:</strong> <span style="color:#CBD5E1;">${escapeHtml(addressFull)}</span>
            </div>
            <div style="margin-bottom:12px;font-size:14.5px;">
              <strong>📞 Phone:</strong> <a href="tel:${escapeHtml(phoneDigits)}" style="color:var(--accent-light);font-weight:700;">${escapeHtml(phoneDisplay)}</a>
            </div>
            <div style="margin-bottom:20px;font-size:14.5px;">
              <strong>⭐ Customer Rating:</strong> <span style="color:#FBBF24;font-weight:700;">Rated ${escapeHtml(ratingVal)} stars from ${escapeHtml(String(reviewVal))} Google reviews</span>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <a href="${escapeHtml(mapsUrl)}" target="_blank" rel="noopener" class="btn btn-accent">📍 Get Directions on Google Maps</a>
              <a href="tel:${escapeHtml(phoneDigits)}" class="btn btn-outline">📞 Tap to Call</a>
            </div>
          </div>

          <div>
            <h3 style="font-size:20px;font-weight:800;margin-bottom:8px;">Send a Quick Message / Request</h3>
            <p style="color:#94A3B8;font-size:13px;margin-bottom:14px;">Have a question, booking request, or quote inquiry? Send it straight to our team.</p>
            <form id="demo-contact-form">
              <input type="text" class="demo-input" placeholder="Your Name" required />
              <input type="tel" class="demo-input" placeholder="Your Phone Number" required />
              <textarea class="demo-input" rows="3" placeholder="How can ${escapeHtml(bizName)} help you today?"></textarea>
              <button type="submit" class="btn btn-accent" style="width:100%;">Send Message →</button>
            </form>
          </div>
        </div>
      </section>

      <footer style="text-align:center;padding:30px 20px 50px;color:#64748B;font-size:13px;border-top:1px solid rgba(255,255,255,0.06);">
        <div>© ${new Date().getFullYear()} ${escapeHtml(bizName)} · ${escapeHtml(addressFull)} · ${escapeHtml(phoneDisplay)}</div>
        <div style="margin-top:6px;color:#93C5FD;">Custom Demo Website Built by <strong>DevEloped Web Co.</strong> · Call (505) 717-5683</div>
      </footer>
    `;

    // PART 3: Locked Feature Popup Handler
    const modal = document.getElementById('demo-lock-modal');
    const openLockModal = (e) => {
      if (e) e.preventDefault();
      modal?.classList.add('open');
    };
    document.querySelectorAll('[data-locked-feature]').forEach(btn => {
      btn.addEventListener('click', openLockModal);
    });
    document.getElementById('demo-contact-form')?.addEventListener('submit', openLockModal);
    document.getElementById('demo-lock-modal-close')?.addEventListener('click', () => {
      modal?.classList.remove('open');
    });
    modal?.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });
  </script>
</body>
</html>
